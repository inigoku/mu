<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Visor 3D STL Interactivo - Marvel United</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #181c24; color: #e2e8f0; overflow: hidden; }
    #toolbar {
      position: fixed; top: 14px; left: 14px; z-index: 10;
      background: rgba(24, 28, 36, 0.9); backdrop-filter: blur(8px);
      padding: 14px 18px; border-radius: 10px; border: 1px solid #334155;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4); max-width: 340px;
    }
    h1 { font-size: 15px; margin: 0 0 8px 0; color: #38bdf8; }
    .btn {
      display: inline-block; background: #0284c7; color: #fff; padding: 7px 12px;
      border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;
      border: none; margin-top: 6px; margin-right: 6px;
    }
    .btn:hover { background: #0369a1; }
    #stats { font-size: 12px; color: #94a3b8; margin-top: 10px; line-height: 1.5; }
    #dropzone {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(2, 132, 199, 0.25); border: 3px dashed #38bdf8; z-index: 20;
      font-size: 22px; font-weight: bold; pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="toolbar">
    <h1>Visor 3D STL (Peana 30×30 mm)</h1>
    <div style="font-size:12px; color:#cbd5e1; margin-bottom:6px;">
      Arrastra cualquier archivo <b>.STL</b> a la ventana o selecciónalo aquí:
    </div>
    <label class="btn">
      Abrir archivo .STL
      <input type="file" id="fileInput" accept=".stl" style="display:none" />
    </label>
    <button class="btn" id="wireBtn" style="background:#334155;">Malla (Wireframe)</button>
    <div id="stats">
      Rejilla azul en suelo: <b>30 × 30 mm</b> (tamaño peana Marvel United).<br/>
      Controles: Clic izq = Rotar | Rueda = Zoom | Clic der = Mover
    </div>
  </div>
  <div id="dropzone">Suelta el archivo .STL aquí</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x181c24);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, -85, 55);
    camera.up.set(0, 0, 1);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 20);
    controls.enableDamping = true;
    controls.update();

    // Iluminación de estudio para resaltar relieves de miniatura
    scene.add(new THREE.AmbientLight(0xffffff, 0.45));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.15);
    keyLight.position.set(-40, -70, 80);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x93c5fd, 0.55);
    fillLight.position.set(60, 50, 30);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffffff, 0.45);
    rimLight.position.set(0, 80, 60);
    scene.add(rimLight);

    // Rejilla de referencia de 30x30 mm en Z=0
    const grid = new THREE.GridHelper(30, 6, 0x38bdf8, 0x334155);
    grid.rotation.x = Math.PI / 2;
    scene.add(grid);

    let currentMesh = null;
    const material = new THREE.MeshStandardMaterial({
      color: 0x6ca6c6,
      roughness: 0.42,
      metalness: 0.08
    });

    function loadSTLBuffer(buffer, name) {
      const loader = new STLLoader();
      const geom = loader.parse(buffer);
      geom.computeVertexNormals();
      geom.computeBoundingBox();

      const box = geom.boundingBox;
      const size = new THREE.Vector3();
      box.getSize(size);
      const center = new THREE.Vector3();
      box.getCenter(center);

      // Centrar en X,Y y apoyar en Z=0
      geom.translate(-center.x, -center.y, -box.min.z);

      if (currentMesh) {
        scene.remove(currentMesh);
        currentMesh.geometry.dispose();
      }
      currentMesh = new THREE.Mesh(geom, material);
      scene.add(currentMesh);

      controls.target.set(0, 0, size.z * 0.48);
      controls.update();

      const tris = (geom.attributes.position.count / 3).toLocaleString();
      document.getElementById('stats').innerHTML =
        `<b>Archivo:</b> ${name}<br/>` +
        `<b>Triángulos:</b> ${tris}<br/>` +
        `<b>Dimensiones:</b> ${size.x.toFixed(1)} × ${size.y.toFixed(1)} × ${size.z.toFixed(1)} mm<br/>` +
        `Rejilla del suelo: <b>30 × 30 mm</b>`;
    }

    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => loadSTLBuffer(ev.target.result, file.name);
      reader.readAsArrayBuffer(file);
    });

    document.getElementById('wireBtn').addEventListener('click', () => {
      material.wireframe = !material.wireframe;
    });

    window.addEventListener('dragover', (e) => {
      e.preventDefault();
      document.getElementById('dropzone').style.display = 'flex';
    });
    window.addEventListener('dragleave', (e) => {
      if (e.relatedTarget === null) {
        document.getElementById('dropzone').style.display = 'none';
      }
    });
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      document.getElementById('dropzone').style.display = 'none';
      const file = e.dataTransfer.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => loadSTLBuffer(ev.target.result, file.name);
      reader.readAsArrayBuffer(file);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
